<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>配对手机 · 桌面生态</title>
  <style>
    .card { align-items: center; }
    .head { width: 100%; }
    .qr-box {
      width: 188px; height: 188px; padding: 12px;
      background: #ffffff; border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: #52525b;
    }
    .qr-box img { width: 100%; height: 100%; display: block; border-radius: 4px; }
    .sub { text-align: center; }
    .status { font-size: 12px; font-weight: 600; color: var(--fg); display: flex; align-items: center; gap: 6px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #52525b; }
    .dot.on { background: #34d399; box-shadow: 0 0 8px rgba(52, 211, 153, 0.6); }
    .net { width: 100%; display: flex; flex-direction: column; gap: 6px; }
    .net select { width: 100%; font-size: 12px; }
    .url-row { display: flex; align-items: center; gap: 6px; width: 100%; }
    .url-row code { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
  </style>
  <script type="module" crossorigin src="./assets/pair-DJIAFSEs.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="./assets/dialog-DA0NrzqE.css">
</head>
<body>
  <div class="card">
    <div class="head">
      <img class="mark" src="./icons/mark.svg" alt="">
      <span class="title">配对手机伴侣</span>
      <button class="close" id="closeBtn" title="关闭" aria-label="关闭">✕</button>
    </div>
    <div class="qr-box" id="qrBox">生成中…</div>
    <div class="net">
      <select id="ipSelect" aria-label="选择局域网网卡" hidden></select>
      <div class="url-row"><code id="urlText">--</code><button class="btn small ghost" id="copyUrl">复制</button></div>
    </div>
    <div class="sub">同一 Wi-Fi 扫码即连 · 连不上请切换网卡或关闭代理</div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">等待手机扫码…</span></div>
  </div>
</body>
</html>
