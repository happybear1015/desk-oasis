<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鱼缸控制台 · 桌面生态</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #f5f5f7;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    .shell {
      width: 100%; height: 100%;
      border-radius: 20px;
      background:
        radial-gradient(circle at 12% 0%, rgba(125, 211, 252, 0.2), transparent 46%),
        radial-gradient(circle at 92% 96%, rgba(56, 189, 248, 0.14), transparent 45%),
        linear-gradient(155deg, rgba(20, 42, 58, 0.92), rgba(13, 27, 40, 0.96));
      border: 1px solid rgba(186, 230, 253, 0.24);
      box-shadow: 0 30px 84px rgba(4, 15, 26, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(28px) saturate(165%);
      display: flex;
      overflow: hidden;
    }

    /* 左侧水雾琉璃侧边栏 */
    .sidebar {
      width: 184px;
      flex: none;
      background: rgba(10, 24, 36, 0.48);
      border-right: 1px solid rgba(186, 230, 253, 0.14);
      display: flex;
      flex-direction: column;
      padding: 16px 10px 14px;
      gap: 4px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 4px 10px 14px;
      -webkit-app-region: drag;
    }
    .brand img { width: 22px; height: 22px; }
    .brand-txt { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; color: #f0f9ff; }
    .brand-ver { font-size: 10.5px; color: rgba(186, 230, 253, 0.6); margin-left: auto; font-variant-numeric: tabular-nums; }

    .nav { display: flex; flex-direction: column; gap: 3px; flex: 1; }
    .nav-btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 8.5px 11px;
      background: transparent;
      color: rgba(224, 242, 254, 0.72);
      font-size: 13px;
      font-weight: 450;
      display: flex;
      align-items: center;
      gap: 9px;
      text-align: left;
      cursor: pointer;
      transition: background 0.14s ease, color 0.14s ease;
    }
    .nav-btn:hover { background: rgba(186, 230, 253, 0.11); color: #ffffff; }
    .nav-btn.on { background: rgba(125, 211, 252, 0.2); color: #ffffff; font-weight: 600; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16); }
    .nav-btn svg {
      width: 15px; height: 15px;
      stroke: currentColor; stroke-width: 1.75; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
      flex: none; opacity: 0.82;
    }
    .nav-btn.on svg { opacity: 1; }
    .nav-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #38bdf8;
      margin-left: auto;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.75);
    }

    .side-foot {
      padding-top: 10px;
      border-top: 1px solid rgba(186, 230, 253, 0.12);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .pro-pill {
      width: 100%;
      border: 1px solid rgba(186, 230, 253, 0.35);
      border-radius: 10px;
      padding: 8px 11px;
      background: linear-gradient(135deg, rgba(125, 211, 252, 0.24), rgba(56, 189, 248, 0.14));
      color: #f0f9ff;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .pro-pill:hover { background: linear-gradient(135deg, rgba(125, 211, 252, 0.34), rgba(56, 189, 248, 0.24)); }

    /* 右侧主内容区 */
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: transparent;
    }
    .topbar {
      height: 54px;
      flex: none;
      padding: 0 24px;
      border-bottom: 1px solid rgba(186, 230, 253, 0.13);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      -webkit-app-region: drag;
    }
    .topbar-left { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
    .topbar h1 { font-size: 16px; font-weight: 600; color: #ffffff; letter-spacing: -0.01em; }
    .topbar-sub { font-size: 12px; color: rgba(186, 230, 253, 0.65); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-right { display: flex; align-items: center; gap: 10px; -webkit-app-region: no-drag; }
    .toast-pill {
      font-size: 12px;
      color: #7dd3fc;
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .toast-pill.bad { color: #fca5a5; }
    .close-btn {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: rgba(186, 230, 253, 0.72);
      font-size: 14px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.12s ease, color 0.12s ease;
    }
    .close-btn:hover { background: rgba(186, 230, 253, 0.16); color: #ffffff; }

    .body {
      flex: 1;
      padding: 20px 24px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .body::-webkit-scrollbar { width: 5px; }
    .body::-webkit-scrollbar-thumb { background: rgba(186, 230, 253, 0.22); border-radius: 3px; }

    /* 通用组件 */
    .seg-bar {
      display: inline-flex;
      padding: 3px;
      border-radius: 11px;
      background: rgba(10, 24, 36, 0.5);
      border: 1px solid rgba(186, 230, 253, 0.16);
      align-self: flex-start;
      gap: 3px;
    }
    .seg-tab {
      border: none;
      border-radius: 8px;
      padding: 6px 14px;
      background: transparent;
      color: rgba(186, 230, 253, 0.7);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .seg-tab:hover { color: #ffffff; }
    .seg-tab.on { background: rgba(125, 211, 252, 0.22); color: #ffffff; font-weight: 600; }

    /* 3 列画廊网格（造景 / 鱼皮） */
    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .g-card {
      border-radius: 13px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.065);
      border: 1px solid rgba(186, 230, 253, 0.16);
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
    }
    .g-card.clickable { cursor: pointer; }
    .g-card.clickable:hover { border-color: rgba(186, 230, 253, 0.38); background: rgba(255, 255, 255, 0.095); transform: translateY(-1px); }
    .g-card.on { border-color: #7dd3fc; box-shadow: 0 0 0 1px rgba(125, 211, 252, 0.35), 0 8px 22px rgba(14, 165, 233, 0.18); }
    .g-thumb {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      display: block;
      background: #0c1b29;
      border-bottom: 1px solid rgba(186, 230, 253, 0.12);
    }
    .g-body {
      padding: 10px 11px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .g-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .g-name { font-size: 13px; font-weight: 600; color: #f0f9ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .g-tag { font-size: 10.5px; color: rgba(186, 230, 253, 0.65); flex: none; }
    .g-tag.on { color: #7dd3fc; font-weight: 600; }
    .g-acts { display: flex; gap: 6px; }
    .g-acts button { flex: 1; }

    /* 卡片分组与表单 */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
    .card {
      border-radius: 14px;
      padding: 16px 18px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(186, 230, 253, 0.16);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card-title { font-size: 13.5px; font-weight: 600; color: #f0f9ff; }
    .card-sub { font-size: 11.5px; color: rgba(186, 230, 253, 0.68); }

    .row { display: flex; align-items: center; gap: 8px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

    .btn {
      border: 1px solid rgba(186, 230, 253, 0.22);
      border-radius: 9px;
      padding: 6.5px 12px;
      background: rgba(255, 255, 255, 0.08);
      color: #f0f9ff;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.12s ease, opacity 0.12s ease;
    }
    .btn:hover:not(:disabled) { background: rgba(186, 230, 253, 0.2); color: #ffffff; }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .btn.pri { background: linear-gradient(135deg, #f0f9ff, #bae6fd); border-color: transparent; color: #0c2436; font-weight: 600; }
    .btn.pri:hover:not(:disabled) { background: #ffffff; }
    .btn.bad { color: #fecaca; border-color: rgba(252, 165, 165, 0.34); background: rgba(239, 68, 68, 0.14); }
    .btn.bad:hover:not(:disabled) { background: rgba(239, 68, 68, 0.26); color: #ffffff; }

    .toggle-row {
      width: 100%;
      border: 1px solid rgba(186, 230, 253, 0.16);
      border-radius: 10px;
      padding: 10px 12px;
      background: rgba(10, 24, 36, 0.34);
      color: #e0f2fe;
      font-size: 12.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      text-align: left;
      transition: background 0.12s ease, border-color 0.12s ease;
    }
    .toggle-row:hover { background: rgba(125, 211, 252, 0.14); }
    .toggle-row.on { border-color: rgba(125, 211, 252, 0.48); background: rgba(125, 211, 252, 0.18); color: #ffffff; }
    .toggle-val { font-size: 11.5px; color: rgba(186, 230, 253, 0.65); flex: none; }
    .toggle-row.on .toggle-val { color: #7dd3fc; font-weight: 600; }

    .seg-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .seg-4 button {
      border: 1px solid rgba(186, 230, 253, 0.18);
      border-radius: 8px;
      padding: 7px 0;
      background: rgba(10, 24, 36, 0.35);
      color: rgba(224, 242, 254, 0.78);
      font-size: 12px;
      cursor: pointer;
    }
    .seg-4 button:hover { background: rgba(125, 211, 252, 0.16); color: #ffffff; }
    .seg-4 button.on { background: #e0f2fe; border-color: #e0f2fe; color: #0c2436; font-weight: 600; }

    .slider-item { display: flex; flex-direction: column; gap: 6px; }
    .slider-head { display: flex; justify-content: space-between; font-size: 12.5px; color: #e0f2fe; }
    .slider-head span:last-child { color: rgba(186, 230, 253, 0.72); font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; height: 4px; accent-color: #7dd3fc; cursor: pointer; }

    input[type="text"], input[type="number"], select, textarea {
      flex: 1;
      min-width: 0;
      border: 1px solid rgba(186, 230, 253, 0.22);
      border-radius: 8px;
      padding: 7px 10px;
      background: rgba(8, 20, 31, 0.55);
      color: #ffffff;
      font-size: 12.5px;
      font-family: inherit;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: rgba(125, 211, 252, 0.7); }
    textarea { width: 100%; min-height: 92px; resize: none; line-height: 1.5; }
    select option { background: #102536; color: #ffffff; }

    .code-pill {
      font-family: var(--font-mono);
      font-size: 12.5px;
      font-weight: 600;
      color: #f0f9ff;
      background: rgba(8, 20, 31, 0.55);
      border: 1px solid rgba(186, 230, 253, 0.18);
      padding: 5px 10px;
      border-radius: 8px;
      user-select: text;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(186, 230, 253, 0.35); flex: none; }
    .dot.on { background: #34d399; box-shadow: 0 0 8px rgba(52, 211, 153, 0.65); }
    .msg-log {
      max-height: 100px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(8, 20, 31, 0.52);
      border: 1px solid rgba(186, 230, 253, 0.14);
      font-size: 12px;
      color: #e0f2fe;
    }
    .qr-box {
      padding: 12px;
      border-radius: 14px;
      background: #ffffff;
      align-self: center;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    }
    .qr-box img { display: block; width: 184px; height: 184px; }
  </style>
  <script type="module" crossorigin src="./assets/console-UUjBHyHr.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="./assets/catalog-CHB2dxSJ.js">
  <link rel="stylesheet" crossorigin href="./assets/tokens-YWs_eDNr.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="./icons/mark.svg" alt="">
        <span class="brand-txt">桌面生态</span>
        <span class="brand-ver" id="verText"></span>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-btn on" data-tab="look">
          <svg viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
          造景与鱼皮
        </button>
        <button class="nav-btn" data-tab="screen">
          <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          桌面形态
        </button>
        <button class="nav-btn" data-tab="friends">
          <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          鱼友串门
          <span class="nav-dot" id="reqDot" hidden></span>
        </button>
        <button class="nav-btn" data-tab="pair">
          <svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>
          手机伴侣
        </button>
        <button class="nav-btn" data-tab="settings">
          <svg viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="2" y1="14" x2="6" y2="14"/><line x1="10" y1="8" x2="14" y2="8"/><line x1="18" y1="16" x2="22" y2="16"/></svg>
          窗口偏好
        </button>
        <button class="nav-btn" data-tab="profile">
          <svg viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          个人中心
        </button>
        <button class="nav-btn" data-tab="feedback">
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          反馈与更新
        </button>
      </nav>
      <div class="side-foot">
        <button class="pro-pill" id="proSideBtn">
          <span id="proSideTxt">升级 PRO</span>
          <span>›</span>
        </button>
      </div>
    </aside>

    <section class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h1 id="pageTitle">造景与鱼皮</h1>
          <span class="topbar-sub" id="pageSub"></span>
        </div>
        <div class="topbar-right">
          <span class="toast-pill" id="toastPill"></span>
          <button class="close-btn" id="closeBtn" title="关闭" aria-label="关闭">✕</button>
        </div>
      </header>
      <main class="body" id="body"></main>
    </section>
  </div>

</body>
</html>
