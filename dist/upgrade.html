<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>升级方案 · 桌面生态</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #f5f5f7;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    .shell {
      width: 100%; height: 100%;
      border-radius: 22px;
      background:
        radial-gradient(circle at 14% 0%, rgba(125, 211, 252, 0.2), transparent 46%),
        radial-gradient(circle at 88% 92%, rgba(56, 189, 248, 0.14), transparent 44%),
        linear-gradient(155deg, rgba(20, 42, 58, 0.93), rgba(13, 27, 40, 0.96));
      border: 1px solid rgba(186, 230, 253, 0.24);
      box-shadow: 0 32px 84px rgba(4, 15, 26, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(28px) saturate(165%);
      display: flex;
      flex-direction: row;
      position: relative;
      overflow: hidden;
    }
    .main-pane {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 右侧嵌入式支付宝扫码支付栏 */
    .pay-drawer {
      width: 264px;
      flex: none;
      border-left: 1px solid rgba(186, 230, 253, 0.16);
      background: rgba(10, 24, 36, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 22px 20px;
      gap: 12px;
      position: relative;
      text-align: center;
    }
    .pay-drawer[hidden] { display: none; }
    .pay-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #8e8e93;
      font-size: 13px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .pay-close:hover { background: rgba(255, 255, 255, 0.08); color: #ffffff; }
    .pay-badge {
      font-size: 11px;
      font-weight: 600;
      color: #60a5fa;
      background: rgba(59, 130, 246, 0.14);
      padding: 3px 10px;
      border-radius: 999px;
    }
    .pay-sku {
      font-size: 13px;
      font-weight: 500;
      color: #d1d1d6;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pay-amount {
      font-size: 28px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .qr-wrap {
      width: 212px;
      height: 212px;
      border-radius: 14px;
      background: #ffffff;
      padding: 8px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr-wrap iframe {
      width: 196px;
      height: 196px;
      border: none;
      display: block;
      background: #ffffff;
    }
    .qr-loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 12px;
      color: #71717a;
      background: #ffffff;
    }
    .qr-loading[hidden] { display: none; }
    .pay-hint {
      font-size: 12px;
      color: #8e8e93;
      line-height: 1.45;
    }
    .pay-alt {
      border: none;
      background: transparent;
      color: #8e8e93;
      font-size: 11.5px;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .pay-alt:hover { color: #ffffff; }

    /* 顶部极简标题栏（可拖拽） */
    .header {
      position: relative;
      padding: 26px 32px 18px;
      text-align: center;
      -webkit-app-region: drag;
    }
    .header h1 {
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #ffffff;
      line-height: 1.25;
    }
    .header p {
      margin-top: 6px;
      font-size: 13px;
      color: #8e8e93;
      font-weight: 400;
    }
    .close-btn {
      -webkit-app-region: no-drag;
      position: absolute;
      top: 18px;
      right: 18px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #8e8e93;
      font-size: 15px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .close-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    /* 双栏方案卡片（ChatGPT / Google One 极简大厂风格） */
    .grid {
      flex: 1;
      padding: 4px 28px 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: stretch;
    }
    .plan {
      border-radius: 16px;
      padding: 22px 24px 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(186, 230, 253, 0.16);
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: border-color 0.18s ease;
    }
    .plan.pro {
      background: linear-gradient(165deg, rgba(125, 211, 252, 0.16), rgba(14, 42, 62, 0.56));
      border-color: rgba(125, 211, 252, 0.48);
      box-shadow: 0 14px 36px rgba(6, 24, 38, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.24);
    }

    .plan-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .plan-name {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .plan-name span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .plan-thumb {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.14);
      flex: none;
    }
    .pill {
      flex: none;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(125, 211, 252, 0.22);
      color: #e0f2fe;
      letter-spacing: 0.01em;
    }

    .price-block {
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-height: 40px;
    }
    .price-currency {
      font-size: 16px;
      font-weight: 500;
      color: #a1a1aa;
    }
    .price-num {
      font-size: 34px;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: #ffffff;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .price-unit {
      font-size: 12.5px;
      color: #8e8e93;
      margin-left: 2px;
    }
    .price-strike {
      font-size: 13px;
      color: #636366;
      text-decoration: line-through;
      margin-left: 4px;
      font-variant-numeric: tabular-nums;
    }

    .cta {
      width: 100%;
      height: 40px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: #f5f5f7;
      transition: background 0.15s ease, transform 0.12s ease, opacity 0.15s ease;
    }
    .cta:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.12);
    }
    .cta.primary {
      border: none;
      background: #ffffff;
      color: #09090b;
    }
    .cta.primary:hover:not(:disabled) {
      background: #e4e4e7;
    }
    .cta:active:not(:disabled) {
      transform: scale(0.985);
    }
    .cta:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.06);
    }

    .features {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 11px;
      flex: 1;
    }
    .features li {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-size: 13px;
      line-height: 1.45;
      color: #d1d1d6;
    }
    .features li.muted-item {
      color: #8e8e93;
    }
    .features li.strong {
      color: #ffffff;
      font-weight: 500;
    }
    .chk {
      width: 15px;
      height: 15px;
      margin-top: 2px;
      flex: none;
      stroke: #a1a1aa;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .plan.pro .chk {
      stroke: #7dd3fc;
    }

    /* 底部极简兑换码入口 */
    .footer {
      padding: 0 28px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 36px;
    }
    .link-btn {
      border: none;
      background: transparent;
      color: #8e8e93;
      font-size: 12px;
      cursor: pointer;
      transition: color 0.15s ease;
    }
    .link-btn:hover { color: #ffffff; }
    .redeem-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .redeem-box[hidden] { display: none; }
    .redeem-box input {
      width: 220px;
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: #1b1b1e;
      color: #ffffff;
      font-size: 12px;
      outline: none;
    }
    .redeem-box input:focus { border-color: rgba(255, 255, 255, 0.35); }
    .redeem-box button {
      height: 32px;
      padding: 0 16px;
      border-radius: 999px;
      border: none;
      background: #ffffff;
      color: #09090b;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .tip {
      font-size: 12px;
      color: #a5b4fc;
    }
    .tip.ok { color: #6ee7b7; }
    .tip.bad { color: #fca5a5; }
    .tip:empty { display: none; }
  </style>
  <script type="module" crossorigin src="./assets/upgrade-BY3u2vvh.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="./assets/catalog-CHB2dxSJ.js">
  <link rel="stylesheet" crossorigin href="./assets/tokens-YWs_eDNr.css">
</head>
<body>
  <div class="shell">
    <div class="main-pane">
      <header class="header">
        <h1 id="pageTitle">升级桌面生态</h1>
        <p id="pageSub">一次买断，永久有效，无任何月费订阅</p>
        <button class="close-btn" id="closeBtn" title="关闭" aria-label="关闭">✕</button>
      </header>

      <main class="grid" id="planGrid"></main>

      <footer class="footer">
        <button class="link-btn" id="redeemToggle">使用兑换码激活</button>
        <div class="redeem-box" id="redeemBox" hidden>
          <input type="text" id="redeemIn" placeholder="输入兑换码" maxlength="40" spellcheck="false">
          <button type="button" id="redeemBtn">激活</button>
        </div>
        <span class="tip" id="statusTip"></span>
      </footer>
    </div>

    <aside class="pay-drawer" id="payDrawer" hidden>
      <button class="pay-close" id="payCloseBtn" title="收起扫码" aria-label="收起扫码">✕</button>
      <span class="pay-badge">支付宝扫码付款</span>
      <div class="pay-sku" id="paySkuName"></div>
      <div class="pay-amount" id="payAmount"></div>
      <div class="qr-wrap">
        <div class="qr-loading" id="qrLoading">正在生成二维码…</div>
        <iframe id="payQrFrame" scrolling="no" frameborder="0" referrerpolicy="no-referrer"></iframe>
      </div>
      <div class="pay-hint">打开手机支付宝扫一扫<br>付款后自动解锁，无需手动刷新</div>
      <button type="button" class="pay-alt" id="payOpenBrowser">无法扫码？在浏览器打开</button>
    </aside>
  </div>

</body>
</html>
