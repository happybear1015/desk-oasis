<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>意见反馈 · 桌面生态</title>
  <style>
    textarea { flex: 1; }
    .history { max-height: 84px; display: flex; flex-direction: column; gap: 5px; }
    .history div { font-size: 11.5px; padding: 7px 9px; border-radius: 8px; background: rgba(255, 255, 255, 0.035); border: 1px solid var(--border); color: var(--fg-muted); line-height: 1.45; }
    .history b { color: #7dd3fc; }
  </style>
  <script type="module" crossorigin src="./assets/feedback-BtGQMuTC.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="./assets/dialog-DA0NrzqE.css">
</head>
<body>
  <div class="card">
    <div class="head">
      <img class="mark" src="./icons/mark.svg" alt="">
      <span class="title">意见反馈</span>
      <button class="close" id="closeBtn" title="关闭" aria-label="关闭">✕</button>
    </div>
    <select id="cat" aria-label="反馈类型">
      <option value="功能建议">功能建议</option>
      <option value="画面体验">画面体验</option>
      <option value="Bug反馈">Bug 反馈</option>
    </select>
    <textarea id="content" placeholder="写下你的想法、想要的造景或遇到的问题…" maxlength="500"></textarea>
    <input type="text" id="contact" placeholder="联系方式（选填，方便我们回复你）" maxlength="48">
    <div class="history scroll" id="history" hidden></div>
    <div class="sub">回复将同步显示于此</div>
    <button class="btn" id="sendBtn">提交反馈</button>
    <div class="tip" id="tip"></div>
  </div>
</body>
</html>
