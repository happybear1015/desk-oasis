<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>菜单 · 桌面生态</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #f5f5f7;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    .stage {
      width: 100%; height: 100%;
      padding: 6px;
      display: flex;
      align-items: flex-start;
    }
    .menu {
      width: 100%;
      background:
        radial-gradient(circle at 18% 0%, rgba(125, 211, 252, 0.2), transparent 56%),
        linear-gradient(160deg, rgba(20, 42, 58, 0.9), rgba(13, 28, 41, 0.94));
      border: 1px solid rgba(186, 230, 253, 0.26);
      box-shadow: 0 20px 48px rgba(4, 15, 25, 0.56), inset 0 1px 0 rgba(255, 255, 255, 0.24);
      border-radius: 15px;
      padding: 7px;
      backdrop-filter: blur(26px) saturate(165%);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .exit-wp {
      width: 100%;
      border: 1px solid rgba(252, 165, 165, 0.38);
      border-radius: 9px;
      padding: 7px 10px;
      margin-bottom: 4px;
      background: rgba(239, 68, 68, 0.2);
      color: #fee2e2;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }
    .exit-wp:hover { background: rgba(239, 68, 68, 0.32); color: #fff; }
    .exit-wp[hidden] { display: none; }

    .quick-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding-bottom: 7px;
      margin-bottom: 2px;
      border-bottom: 1px solid rgba(186, 230, 253, 0.14);
    }
    .q-btn {
      border: 1px solid rgba(186, 230, 253, 0.22);
      border-radius: 9px;
      padding: 7px 0;
      background: rgba(255, 255, 255, 0.08);
      color: #f0f9ff;
      font-size: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      transition: background 0.14s ease, border-color 0.14s ease, transform 0.12s ease;
    }
    .q-btn:hover { background: rgba(125, 211, 252, 0.2); border-color: rgba(186, 230, 253, 0.42); color: #fff; }
    .q-btn:active { transform: scale(0.97); }
    .q-btn svg { width: 13.5px; height: 13.5px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0.9; }

    .m-row {
      width: 100%;
      border: none;
      border-radius: 9px;
      padding: 7.5px 10px;
      background: transparent;
      color: #e0f2fe;
      font-size: 12.5px;
      font-weight: 450;
      display: flex;
      align-items: center;
      gap: 9px;
      text-align: left;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
    }
    .m-row:hover { background: rgba(186, 230, 253, 0.14); color: #ffffff; }
    .m-row.console-entry {
      background: linear-gradient(135deg, rgba(125, 211, 252, 0.2), rgba(56, 189, 248, 0.1));
      border: 1px solid rgba(186, 230, 253, 0.25);
      color: #ffffff;
      font-weight: 600;
    }
    .m-row.console-entry:hover { background: linear-gradient(135deg, rgba(125, 211, 252, 0.3), rgba(56, 189, 248, 0.18)); }
    .m-row svg.ico {
      width: 14.5px; height: 14.5px;
      stroke: currentColor; stroke-width: 1.75; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
      opacity: 0.82; flex: none;
    }
    .m-row:hover svg.ico, .m-row.console-entry svg.ico { opacity: 1; }
    .m-row .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .m-row .meta { font-size: 11px; color: rgba(186, 230, 253, 0.65); font-variant-numeric: tabular-nums; }
    .m-row .meta.on { color: #6ee7b7; font-weight: 600; }
    .dot-badge { width: 6px; height: 6px; border-radius: 50%; background: #38bdf8; box-shadow: 0 0 8px rgba(56, 189, 248, 0.8); flex: none; }
    .sep { height: 1px; background: rgba(186, 230, 253, 0.13); margin: 3px 6px; }
    .m-row.quit { color: #fecaca; }
    .m-row.quit:hover { background: rgba(239, 68, 68, 0.2); color: #ffffff; }
  </style>
  <script type="module" crossorigin src="./assets/menu--OZZ5qKj.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="./assets/tokens-YWs_eDNr.css">
</head>
<body>
  <div class="stage" id="stage">
    <div class="menu">
      <button class="exit-wp" id="exitWpBtn" hidden>退出桌面壁纸</button>

      <div class="quick-bar">
        <button class="q-btn" data-cmd="action:feed">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="2"/><circle cx="7.5" cy="15.5" r="2"/><circle cx="16.5" cy="15.5" r="2"/></svg>
          喂鱼
        </button>
        <button class="q-btn" data-cmd="action:clean">
          <svg viewBox="0 0 24 24"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
          擦缸
        </button>
      </div>

      <button class="m-row" data-cmd="roam">
        <svg class="ico" viewBox="0 0 24 24"><path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.47-3.44 6-7 6s-7.56-2.53-8.5-6Z"/><path d="M18 12v.5"/><path d="M2 9.5c1.5 1 2.5 2.5 2.5 2.5S3.5 13.5 2 14.5"/></svg>
        <span class="lbl" id="roamLbl">桌面漫游</span>
        <span class="meta" id="roamMeta"></span>
      </button>
      <button class="m-row" data-cmd="screensaver">
        <svg class="ico" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        <span class="lbl">锁屏屏保</span>
        <span class="meta" id="ssMeta">大时钟</span>
      </button>
      <button class="m-row" data-cmd="wallpaper">
        <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        <span class="lbl" id="wpLbl">动态壁纸</span>
        <span class="meta" id="wpMeta"></span>
      </button>

      <div class="sep"></div>

      <button class="m-row console-entry" id="openConsoleBtn">
        <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span class="lbl">鱼缸控制台</span>
        <span class="dot-badge" id="reqDot" hidden></span>
        <span class="meta">›</span>
      </button>

      <div class="sep"></div>

      <button class="m-row" data-cmd="hide">
        <svg class="ico" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
        <span class="lbl">收起鱼缸</span>
        <span class="meta" id="bossText">Ctrl+Alt+M</span>
      </button>
      <button class="m-row quit" data-cmd="quit">
        <svg class="ico" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span class="lbl">退出</span>
      </button>
    </div>
  </div>

</body>
</html>
